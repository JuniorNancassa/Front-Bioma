<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio-Guiné Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="assets/css/adim.css">
</head>
<body>
  <div class="layout">
    <aside id="sider" class="sider">
      <a href="index.html" class="logo">
        <img src="assets/img/logo/logo-bioma.jpeg" alt="Logo">
        <span class="logo-text">Bioma-Guiné</span>
      </a>

      <nav class="menu-container">
        <ul class="menu">
          <li onclick="loadContent('Inicio', this)" class="active">
            <div class="menu-item"><i class="fas fa-chart-pie"></i> <span class="menu-text">Inicio</span></div>
          </li>
          <li onclick="loadContent('Usuários', this)">
            <div class="menu-item"><i class="fas fa-user"></i> <span class="menu-text">Usuários</span></div>
          </li>
          <li onclick="loadContent('Seres', this)">
            <div class="menu-item"><i class="fas fa-dragon"></i> <span class="menu-text">Seres</span></div>
          </li>
          <li onclick="loadContent('Denúncias', this)">
            <div class="menu-item"><i class="fas fa-exclamation-triangle"></i> <span class="menu-text">Denúncias</span></div>
          </li>
          <li onclick="loadContent('Quiz', this)">
            <div class="menu-item"><i class="fas fa-question-circle"></i> <span class="menu-text">Quiz</span></div>
          </li>
          <li onclick="loadContent('Estatistica', this)">
            <div class="menu-item"><i class="fas fa-chart-line"></i> <span class="menu-text">Estatística</span></div>
          </li>
        </ul>
      </nav>

      <div class="logout-btn" onclick="openLogoutModal()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sair</span>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="toggle-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
        <div class="header-right" onclick="loadContent('Perfil')">
          <i class="fas fa-user-circle fa-lg"></i>
          <span id="user-display-name" style="margin-left: 10px; font-weight: 500;">Admin</span>
        </div>
      </header>

      <section class="content">
        <div id="breadcrumb" class="breadcrumb">Dashboard / Inicio</div>
        <div id="main-content">
           </div>
      </section>

      <footer class="footer">
        Bioma-Guiné © <span id="year"></span>
      </footer>
    </main>
  </div>

  <template id="perfil-template">
    <div class="card-perfil">
      <h2>Perfil do Usuário</h2>
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      <p><strong>Login:</strong> <span class="user-login"></span></p>
      <p><strong>E-mail:</strong> <span class="user-email"></span></p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/page/adim.js"></script>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
