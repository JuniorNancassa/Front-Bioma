<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioma-Guiné: O Jogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="assets/css/quiz.css">

  
</head>
<body>

<a href="index.html" class="btn-home"><i class="fas fa-home"></i></a>

<section id="screen-start" class="screen active">
    <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h1 style="font-family:'Montserrat'; font-size:clamp(3rem, 10vw, 5rem); color:var(--verde-guine); text-align:center;">BIOMA<br><span style="color:var(--vermelho-guine)">GUINÉ</span></h1>
        <div id="user-welcome" style="margin-top:20px; font-weight:bold;">Carregando perfil...</div>
    </div>
    <button class="btn-action" onclick="fetchCategories()">INICIAR JOGO</button>
</section>

<section id="screen-categories" class="screen">
    <h2 style="color:var(--verde-guine)">MISSÕES DISPONÍVEIS</h2>
    <div id="categories-grid" class="grid-layout"></div>
    <button onclick="goToScreen('screen-start')" style="margin-top:auto; background:none; border:none; cursor:pointer; font-weight:bold;">VOLTAR</button>
</section>

<section id="screen-levels" class="screen">
    <h2 id="cat-title" style="color:var(--verde-guine)">NÍVEIS</h2>
    <div id="levels-grid" class="grid-layout"></div>
    <button onclick="goToScreen('screen-categories')" style="margin-top:auto; background:none; border:none; cursor:pointer; font-weight:bold;">VOLTAR</button>
</section>

<section id="screen-quiz" class="screen">
    <div class="hud-wrapper">
        <div class="hud-info">
            <div id="lives">❤️❤️❤️</div>
            <div id="score" style="color:var(--verde-guine)">⭐ 0</div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-fill"></div></div>
    </div>
    <div class="question-area"><h2 id="q-text">...</h2></div>
    <div id="ans-container" class="options-grid"></div>
    <button id="next-btn" class="btn-action" style="display:none; width:100%;">PRÓXIMA</button>
</section>

<script>
    const API_BASE = "http://localhost:8080/api/quiz"; 
    let currentQuestions = [], currentIdx = 0, lives = 3, score = 0, currentLevelId = null;

    // --- FUNÇÕES DE API ---

    async function fetchCategories() {
        const res = await fetch(`${API_BASE}/categories`);
        const categories = await res.json();
        const grid = document.getElementById('categories-grid');
        grid.innerHTML = "";
        
        categories.forEach(cat => {
            grid.innerHTML += `
                <div class="card-game" onclick="fetchLevels(${cat.id}, '${cat.name}')">
                    <i class="fas fa-leaf fa-3x" style="color:var(--verde-guine)"></i>
                    <h3>${cat.name}</h3>
                </div>`;
        });
        goToScreen('screen-categories');
    }

    async function fetchLevels(catId, catName) {
        document.getElementById('cat-title').textContent = catName;
        const res = await fetch(`${API_BASE}/categories/${catId}/levels`);
        const levels = await res.json();
        const grid = document.getElementById('levels-grid');
        grid.innerHTML = "";

        levels.forEach(lvl => {
            // Supondo que seu LevelDTO tenha 'unlocked' e 'stars'
            const lockedClass = lvl.unlocked ? '' : 'locked';
            grid.innerHTML += `
                <div class="card-game ${lockedClass}" onclick="${lvl.unlocked ? `startQuiz(${lvl.id})` : ''}">
                    <h3>Nível ${lvl.number}</h3>
                    <p style="color:var(--amarelo-guine)">${'⭐'.repeat(lvl.stars || 0)}</p>
                </div>`;
        });
        goToScreen('screen-levels');
    }

    async function startQuiz(levelId) {
        currentLevelId = levelId;
        const res = await fetch(`${API_BASE}/levels/${levelId}/questions`);
        currentQuestions = await res.json();
        
        lives = 3; score = 0; currentIdx = 0;
        updateHUD();
        showQuestion();
        goToScreen('screen-quiz');
    }

    async function checkAnswerApi(questionId, selectedIndex, btn) {
        const res = await fetch(`${API_BASE}/questions/${questionId}/answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ selectedIndex })
        });
        const result = await res.json(); // { correct: true/false }

        document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);

        if(result.correct) {
            btn.classList.add("correct");
            score++;
            playSfx('correct');
        } else {
            btn.classList.add("wrong");
            playSfx('wrong');
            lives--;
        }

        updateHUD();
        document.getElementById("next-btn").style.display = "block";
        if(lives <= 0) {
            setTimeout(() => { alert("Game Over! Tente novamente."); goToScreen('screen-levels'); }, 500);
        }
    }

    async function saveFinalProgress() {
        await fetch(`${API_BASE}/levels/${currentLevelId}/progress`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stars: score })
        });
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        setTimeout(() => { alert("Nível Concluído!"); fetchCategories(); }, 1000);
    }

    // --- LÓGICA DE INTERFACE ---

    function showQuestion() {
        const q = currentQuestions[currentIdx];
        document.getElementById("q-text").textContent = q.text; // Ajuste para o nome do campo no seu QuestionDTO
        const container = document.getElementById("ans-container");
        container.innerHTML = "";
        document.getElementById("next-btn").style.display = "none";
        
        document.getElementById("progress-bar").style.width = `${(currentIdx / currentQuestions.length) * 100}%`;

        q.answers.forEach((ans, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = ans;
            btn.onclick = () => checkAnswerApi(q.id, i, btn);
            container.appendChild(btn);
        });
    }

    document.getElementById("next-btn").onclick = () => {
        currentIdx++;
        if(currentIdx < currentQuestions.length) showQuestion();
        else saveFinalProgress();
    };

    function goToScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function updateHUD() {
        document.getElementById("lives").textContent = "❤️".repeat(lives);
        document.getElementById("score").textContent = "⭐ " + score;
    }

    function playSfx(type) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(type === 'correct' ? 600 : 200, audioCtx.currentTime);
        osc.start(); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.stop(audioCtx.currentTime + 0.3);
    }
</script>
</body>
</html>
