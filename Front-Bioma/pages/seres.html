                    placeholder="Nome do ser">


            </div>



            <!-- NOME CIENTÍFICO -->
            <div class="form-group">

                    Nome científico

                        Criticamente em perigo

                        Em perigo

            ================================================== -->

                <!-- COORDENADAS -->
                <div class="coordinates-grid">


                    <div>


                        <label for="edit-lat">

                            Latitude

                        </label>


                        <input
                            type="text"
                            id="edit-lat"
                            name="latitude"
                            readonly
                            placeholder="Latitude">


                    </div>



                    <div>


                        <label for="edit-long">

                            Longitude

                        </label>


                        <input
                            type="text"
                            id="edit-long"
                            name="longitude"
                            readonly

    <!-- =========================================================
         MENU HAMBURGER
    ========================================================== -->
    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const hamburger =
                    document.getElementById("hamburger");


                const sidebar =
                    document.getElementById("sidebar");


                const menuOverlay =
                    document.getElementById("menu-overlay");


                const body =
                    document.body;



                /* ===============================================
                   VERIFICAR ELEMENTOS
                =============================================== */

                if (
                    !hamburger ||
                    !sidebar ||
                    !menuOverlay
                ) {

                    console.error(
                        "Menu mobile: elementos não encontrados."
                    );

                    return;

                }



                /* ===============================================
                   ABRIR MENU
                =============================================== */

                function abrirMenu() {


                    sidebar.classList.add("active");


                    menuOverlay.classList.add("active");


                    body.classList.add("no-scroll");


                    hamburger.setAttribute(
                        "aria-expanded",
                        "true"
                    );


                    hamburger.setAttribute(
                        "aria-label",
                        "Fechar menu"
                    );


                    sidebar.setAttribute(
                        "aria-hidden",
                        "false"
                    );


                    menuOverlay.setAttribute(
                        "aria-hidden",
                        "false"
                    );


                }



                /* ===============================================
                   FECHAR MENU
                =============================================== */

                function fecharMenu() {


                    sidebar.classList.remove("active");


                    menuOverlay.classList.remove("active");


                    body.classList.remove("no-scroll");


                    hamburger.setAttribute(
                        "aria-expanded",
                        "false"
                    );


                    hamburger.setAttribute(
                        "aria-label",
                        "Abrir menu"
                    );


                    sidebar.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    menuOverlay.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                }



                /* ===============================================
                   CLICK NO HAMBURGER
                =============================================== */

                hamburger.addEventListener(
                    "click",
                    function () {


                        if (
                            sidebar.classList.contains("active")
                        ) {

                            fecharMenu();

                        } else {

                            abrirMenu();

                        }


                    }
                );



                /* ===============================================
                   CLICK NO OVERLAY
                =============================================== */

                menuOverlay.addEventListener(
                    "click",
                    fecharMenu
                );



                /* ===============================================
                   FECHAR AO CLICAR NO LINK
                =============================================== */

                const links =
                    sidebar.querySelectorAll("a");


                links.forEach(
                    function (link) {


                        link.addEventListener(
                            "click",
                            fecharMenu
                        );


                    }
                );



                /* ===============================================
                   ESC PARA FECHAR
                =============================================== */

                document.addEventListener(
                    "keydown",
                    function (event) {


                        if (
                            event.key === "Escape" &&
                            sidebar.classList.contains("active")
                        ) {

                            fecharMenu();

                        }


                    }
                );


            }
        );

    </script>
