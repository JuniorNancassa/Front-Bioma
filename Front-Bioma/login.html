<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login</title>

  <!-- CSS customizado -->
  <link rel="stylesheet" href="assets/css/login.css">    

  <!-- MDBootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer"/>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #f5f5f5;">

<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-6">
        <div class="card shadow" style="border-radius: 1rem;">
          <div class="card-body p-5">

            <!-- Título -->
            <div class="text-center mb-4">
              <i class="fa fa-user fa-3x icon-green"></i>
              <h3 class="mt-3">Login</h3>
            </div>

            <!-- Botão Google Login -->
            <div class="text-center mb-3">
              <div id="g_id_onload"
                   data-client_id="SEU_CLIENT_ID_GOOGLE.apps.googleusercontent.com"
                   data-login_uri="http://localhost:8080/api/auth/google"
                   data-auto_prompt="false">
              </div>
              <div class="g_id_signin" data-type="standard"></div>
            </div>

            <p class="text-center">ou use sua conta</p>

            <!-- Login tradicional -->
            <div class="mb-4">
              <label for="login" class="form-label">Login</label>
              <input type="text" id="login" class="form-control form-control-lg" />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Senha</label>
              <input type="password" id="password" class="form-control form-control-lg" />
            </div>
            <div class="form-check d-flex justify-content-start mb-4">
              <input class="form-check-input" type="checkbox" value="" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"> Lembrar de mim </label>
            </div>

            <button class="btn btn-success btn-lg btn-block w-100 mb-4" onclick="login()">Entrar</button>
            <p class="text-center">Não tem conta? <a href="register.html">Criar</a></p>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- JS -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="assets/page/login.js"></script>
</body>
</html>
